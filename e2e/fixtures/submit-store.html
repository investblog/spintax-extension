<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Developer Dashboard — New item</title></head>
<body>
  <h1>Submit a new item</h1>
  <nav><a href="/">Home</a> · <form action="/search"><input type="search" name="q" placeholder="Search the store"></form></nav>
  <form id="listing" action="#" method="post" enctype="multipart/form-data">
    <p><label for="title">Product name</label><br><input id="title" type="text" name="title" maxlength="75"></p>
    <p><label for="short">Short description</label><br><input id="short" type="text" name="summary" maxlength="132"></p>
    <p><label for="tagline">Tagline (max 20)</label><br><input id="tagline" type="text" name="tagline" maxlength="20"></p>
    <p><label for="category">Category</label><br>
      <select id="category" name="category">
        <option value="">Choose…</option>
        <option value="productivity">Productivity</option>
        <option value="dev">Developer Tools</option>
        <option value="social">Social &amp; Communication</option>
      </select></p>
    <p><label for="icon">Store icon (128×128 PNG)</label><br><input id="icon" type="file" name="icon" accept="image/png"></p>
    <p><label for="shot">Screenshot (1280×800)</label><br><input id="shot" type="file" name="screenshot" accept="image/png,image/jpeg"></p>
    <p><label for="desc">Detailed description</label><br><textarea id="desc" name="description" rows="8" cols="60"></textarea></p>
    <p><label for="support">Support email</label><br><input id="support" type="email" name="support_email"></p>
    <p><button type="submit">Submit for review</button></p>
  </form>
  <script>
    document.getElementById('listing').addEventListener('submit', (e) => { e.preventDefault(); document.body.dataset.submitted = '1'; });
  </script>
</body>
</html>
