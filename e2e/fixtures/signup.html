<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign up — fixture</title>
</head>
<body>
  <!-- Shape measured on real sign-up forms (ADR 0014): display name, e-mail, password, a terms box. -->
  <form id="signup" action="#" onsubmit="return false">
    <label for="display">Display name</label>
    <input id="display" name="DisplayName" type="text">
    <label for="email">Email address</label>
    <input id="email" name="Email" type="email">
    <label for="password">Choose a password</label>
    <input id="password" name="Password" type="password" autocomplete="new-password">
    <label><input id="terms" name="AcceptTerms" type="checkbox"> I accept the terms</label>
    <button type="submit">Sign up</button>
  </form>
</body>
</html>
